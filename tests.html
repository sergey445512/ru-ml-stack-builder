<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>Проверки конструктора</title>
<body><h1>Проверки конструктора</h1><pre id="result">Запуск…</pre>
<script src="app.js"></script>
<script>
const errors = [];
function check(condition, message) { if (!condition) errors.push(message); }
check(INDUSTRIES.length === 8, 'Должны быть все восемь направлений');
check(INDUSTRIES.reduce((count, item) => count + item.companies.length, 0) === 23, 'Должны быть все 23 примера компаний');
for (const industry of INDUSTRIES) {
  check(industry.evidence.length > 0, `Нет кейса: ${industry.id}`);
  for (const id of industry.evidence) check(SOURCES[id] && CASE_TECH[id], `Нет описания источника: ${id}`);
  const result = buildStack(industry.id);
  check(result.items.length === 20, `Неполный стек: ${industry.id}`);
  check(result.options.ml === true, `ML отключён: ${industry.id}`);
  check(result.items.some(item => item.tech === 'MLflow'), `Нет ML-слоя: ${industry.id}`);
  for (const item of result.items) {
    check(item.status !== 'confirmed' || (industry.evidence.includes(item.source) && CASE_TECH[item.source][item.tech] === item.source), `Ложное подтверждение: ${industry.id} / ${item.tech}`);
  }
}
const development = buildStack('development');
check(development.items.some(item => item.tech === 'MLflow' && item.source === 'samolet'), 'Не показан MLflow из публикации Самолёта');
const services = buildStack('services');
check(services.items.some(item => item.tech === 'ClickHouse' && item.source === 'tutu'), 'Не показан ClickHouse из публикации Туту');
const output = document.getElementById('result');
output.dataset.status = errors.length ? 'fail' : 'pass';
output.textContent = errors.length ? `FAIL: ${errors.join('; ')}` : 'PASS: все сценарии и источники проверены';
</script></body></html>
