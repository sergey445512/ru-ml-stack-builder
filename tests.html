<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>Проверки конструктора</title>
<body><h1>Проверки конструктора</h1><pre id="result">Запуск…</pre>
<script src="app.js?v=4"></script><script src="catalog.js?v=4"></script><script src="engine.js?v=4"></script>
<script>
const errors=[];
function check(condition,message){if(!condition)errors.push(message);}
check(INDUSTRIES.length===8,'8 направлений');
check(INDUSTRIES.reduce((n,x)=>n+x.companies.length,0)===23,'23 компании');
for(const industry of INDUSTRIES)for(const [id] of industry.companies){
  const result=buildStack(industry.id,id);
  check(result.items.length===20,'20 слоёв: '+id);
  check(Boolean(result.project),'Нет идеи проекта: '+id);
  check(result.items.every(x=>x.example && x.example.length>30),'Нет примера применения: '+id);
  check(result.items.every(x=>x.tools.every(t=>t.tech!=='Не добавляем')),'Пустая рекомендация: '+id);
  check(result.items.every(x=>x.tools.length>0&&x.tools.length<=3),'Лишние/пустые инструменты: '+id);
  for(const item of result.items)for(const tool of item.tools){
    check(Boolean(STATUS_LABELS[tool.status]),'Статус '+id+'/'+tool.tech);
    check(!['confirmed','mentioned','trial'].includes(tool.status)||Boolean(SOURCES[tool.source]),'Нет источника '+id+'/'+tool.tech);
    check(!['proposed','optional'].includes(tool.status)||!tool.source,'Гипотеза с чужим подтверждением '+id);
  }
  check(exportText(result).includes(result.profile.note),'Экспорт потерял ограничения '+id);
}
const toolsFor=(industry,company,layer)=>buildStack(industry,company).items.find(x=>x.id===layer).tools;
check(toolsFor('ecommerce','goldapple','sql').some(x=>x.tech==='SQL Server'&&x.source==='goldSql'),'Нет SQL Server Goldapple');
check(toolsFor('ecommerce','goldapple','sql').some(x=>x.tech==='PostgreSQL'&&x.status==='trial'),'Postgres Trial ошибочно объявлен production');
check(toolsFor('ecommerce','goldapple','nosql').some(x=>x.tech==='MongoDB'),'Пропала MongoDB');
check(toolsFor('industrial','nornickel','experiments').some(x=>x.tech==='MLflow'&&x.status==='confirmed'),'Не учтён кейс Норникеля');
check(toolsFor('finance','ingos','experiments').some(x=>x.tech==='Kolmogorov AI'),'Ингосстраху подставлен общий MLflow');
check(toolsFor('services','domclick','pipeline').length===2,'Не разделены batch и обучение');
check(toolsFor('services','tutu','sql').length===2,'Потеряны SQL-базы Туту');
check(toolsFor('retail','detmir','vector').some(x=>x.tech==='Qdrant'&&x.status==='optional'&&!x.source),'Qdrant для Детского мира должен быть гипотезой');
check(toolsFor('services','domclick','vector').some(x=>x.tech==='Elasticsearch'&&x.source==='domclick'),'Потерян подтвержденный Elasticsearch');
check(toolsFor('development','samolet','vector').some(x=>x.tech==='Qdrant'&&x.source==='samolet'),'Потерян подтвержденный Qdrant');
check(toolsFor('logistics','onlinetrade','distributed')[0].status==='optional','Spark навязывается по масштабу');
check(buildStack('logistics','onlinetrade').sources.length===0,'Onlinetrade присвоен чужой стек');
const frame=document.createElement('iframe');
frame.src='index.html';
frame.style='position:absolute;left:-5000px;top:0;width:1366px;height:768px;border:0';
frame.onload=async()=>{
 try{
  const doc=frame.contentDocument,win=frame.contentWindow;
  check(doc.querySelectorAll('script[src],link[rel="stylesheet"]').length===0,'Страница зависит от внешних файлов');
  for(const industry of INDUSTRIES){
    doc.getElementById('industry').value=industry.id;
    doc.getElementById('industry').dispatchEvent(new win.Event('change',{bubbles:true}));
    check(doc.getElementById('company').options.length===industry.companies.length,'Список компаний '+industry.id);
    for(const [id,name] of industry.companies){
      doc.getElementById('company').value=id;
      doc.getElementById('company').dispatchEvent(new win.Event('change',{bubbles:true}));
      check(doc.querySelectorAll('.stack-card').length===20,'Пустой стек '+id);
      check(doc.getElementById('summary').textContent.includes(name),'Не обновилась компания '+id);
      doc.querySelector('.tool-chip').click();
      check(doc.getElementById('sources-dialog').open,'Детали не открылись '+id);
      check(doc.getElementById('sources-list').textContent.length>20,'Нет пояснений '+id);
      doc.getElementById('sources-close').click();
      check(!doc.getElementById('sources-dialog').open,'Не закрывается диалог '+id);
    }
  }
  for(const [width,height] of [[1366,768],[1440,900],[390,844]]){
    frame.style.width=width+'px';frame.style.height=height+'px';
    await new Promise(resolve=>setTimeout(resolve,100));
    check(doc.documentElement.scrollWidth<=width+1,'Горизонтальная прокрутка '+width);
    if(width>760){
      const stack=doc.getElementById('stack');
      check(stack.scrollHeight<=stack.clientHeight+2,'Стек не влез '+width+'x'+height);
      check(doc.documentElement.scrollHeight<=height+2,'Страница не влезла '+width+'x'+height);
    }
  }
 }catch(error){errors.push(error.stack);}
 const output=document.getElementById('result');output.dataset.status=errors.length?'fail':'pass';
 output.textContent=errors.length?'FAIL: '+errors.join('; '):'PASS: 23 компании, источники, статусы, диалоги, 3 размера экрана';
};
document.body.append(frame);
</script></body></html>
